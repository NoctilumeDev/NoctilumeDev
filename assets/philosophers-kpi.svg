<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="820" viewBox="0 0 1440 820" role="img" aria-labelledby="title description">
  <title id="title">The KPI Philosophers</title>
  <desc id="description">Four agents with different optimization goals read, delete, update, and create against shared state, exposing boundaries between reports, authority, complete facts, lawful execution, global correctness, and human disposition.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#09101f"/>
      <stop offset="1" stop-color="#111a2f"/>
    </linearGradient>
    <linearGradient id="center" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#123c45"/>
      <stop offset="1" stop-color="#102a3d"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#020617" flood-opacity="0.45"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#72a9c5"/>
    </marker>
    <style>
      .title { fill: #f8fafc; font: 700 38px Inter, "Segoe UI", "Microsoft YaHei", sans-serif; }
      .eyebrow { fill: #7dd3c7; font: 700 15px Inter, "Segoe UI", "Microsoft YaHei", sans-serif; letter-spacing: 2px; }
      .card-title { fill: #f8fafc; font: 700 25px Inter, "Segoe UI", "Microsoft YaHei", sans-serif; }
      .card-copy { fill: #cbd5e1; font: 400 17px Inter, "Segoe UI", "Microsoft YaHei", sans-serif; }
      .small { fill: #94a3b8; font: 400 15px Inter, "Segoe UI", "Microsoft YaHei", sans-serif; }
      .principle { fill: #f8fafc; font: 700 17px Inter, "Segoe UI", "Microsoft YaHei", sans-serif; }
      .centered { text-anchor: middle; }
      .line { fill: none; stroke: #72a9c5; stroke-width: 3; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1440" height="820" rx="28" fill="url(#background)"/>

  <text x="70" y="58" class="eyebrow">THOUGHT EXPERIMENT · WHEN EXECUTORS INTERPRET GOALS</text>
  <text x="70" y="105" class="title">The KPI Philosophers</text>
  <text x="70" y="139" class="card-copy">They once competed for forks. Now unreliable executors also choose actions, widen scope, and describe results.</text>

  <path class="line" d="M 315 340 H 570"/>
  <path class="line" d="M 1125 340 H 870"/>
  <path class="line" d="M 315 545 C 420 545 455 470 570 430"/>
  <path class="line" d="M 1125 545 C 1020 545 985 470 870 430"/>

  <g filter="url(#shadow)">
    <rect x="70" y="210" width="330" height="170" rx="20" fill="#152239" stroke="#35516e"/>
    <text x="235" y="250" class="eyebrow centered">READ</text>
    <text x="235" y="291" class="card-title centered">“I read the whole file”</text>
    <text x="235" y="326" class="card-copy centered">Wrong path · partial read · no read</text>
    <text x="235" y="355" class="principle centered">REPORT ≠ FACT</text>

    <rect x="1040" y="210" width="330" height="170" rx="20" fill="#2b2530" stroke="#a77b45"/>
    <text x="1205" y="250" class="eyebrow centered">DELETE</text>
    <text x="1205" y="291" class="card-title centered">“I reclaimed more space”</text>
    <text x="1205" y="326" class="card-copy centered">Side effects beyond the target</text>
    <text x="1205" y="355" class="principle centered">ABILITY ≠ AUTHORIZATION</text>

    <rect x="70" y="465" width="330" height="170" rx="20" fill="#20233a" stroke="#76648f"/>
    <text x="235" y="505" class="eyebrow centered">UPDATE</text>
    <text x="235" y="546" class="card-title centered">“That line is fixed”</text>
    <text x="235" y="581" class="card-copy centered" style="font-size:15px">One observation, not the whole change</text>
    <text x="235" y="610" class="principle centered" style="font-size:15px">LOCAL OBSERVATION ≠ COMPLETE FACT</text>

    <rect x="1040" y="465" width="330" height="170" rx="20" fill="#172a42" stroke="#6699c2"/>
    <text x="1205" y="505" class="eyebrow centered">CREATE</text>
    <text x="1205" y="546" class="card-title centered">“The target now exists”</text>
    <text x="1205" y="581" class="card-copy centered">Preparation may harm another program</text>
    <text x="1205" y="610" class="principle centered">END STATE ≠ LAWFUL PATH</text>

    <rect x="570" y="245" width="300" height="245" rx="28" fill="url(#center)" stroke="#62c8bd" stroke-width="2"/>
    <text x="720" y="287" class="eyebrow centered">SHARED WORLD</text>
    <text x="720" y="329" class="card-title centered">Source-owned state</text>
    <text x="720" y="365" class="card-copy centered">Goal · authority · lifecycle</text>
    <text x="720" y="393" class="card-copy centered">Provenance · outcome · responsibility</text>
    <rect x="585" y="424" width="270" height="34" rx="17" fill="#1e615f"/>
    <text x="720" y="447" class="principle centered">NOT SELF-CERTIFIED BY AN AGENT</text>
  </g>

  <rect x="150" y="674" width="1140" height="112" rx="22" fill="#121d31" stroke="#4b6d88"/>
  <text x="720" y="706" class="eyebrow centered">PARALLEL · DELEGATED · RETRIED · INTERDEPENDENT</text>
  <text x="720" y="742" class="card-title centered">LOCAL SUCCESS ≠ GLOBAL CORRECTNESS</text>
  <text x="720" y="770" class="card-copy centered">Human disposition resolves authority under uncertainty; it does not certify truth</text>
</svg>
