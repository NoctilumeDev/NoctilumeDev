<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1080" viewBox="0 0 1440 1080" role="img" aria-labelledby="title description">
  <title id="title">NoctilumeDev project journey</title>
  <desc id="description">From five HTML experiments to DarkRoomLibrary, where Qixu and PlainJournal become separate business branches with distinct fact ownership, then through single-machine limits to three decoupled infrastructure laboratories.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#09101f"/>
      <stop offset="1" stop-color="#111a2f"/>
    </linearGradient>
    <linearGradient id="veritrail" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#123c45"/>
      <stop offset="1" stop-color="#102a3d"/>
    </linearGradient>
    <linearGradient id="feedback" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#173150"/>
      <stop offset="1" stop-color="#1c2944"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#020617" flood-opacity="0.45"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#72a9c5"/>
    </marker>
    <marker id="arrow-warm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d5a85b"/>
    </marker>
    <style>
      .title { fill: #f8fafc; font: 700 34px Inter, "Segoe UI", "Microsoft YaHei", sans-serif; }
      .eyebrow { fill: #7dd3c7; font: 700 15px Inter, "Segoe UI", "Microsoft YaHei", sans-serif; letter-spacing: 2px; }
      .card-title { fill: #f8fafc; font: 700 24px Inter, "Segoe UI", "Microsoft YaHei", sans-serif; }
      .card-copy { fill: #cbd5e1; font: 400 17px Inter, "Segoe UI", "Microsoft YaHei", sans-serif; }
      .small { fill: #94a3b8; font: 400 15px Inter, "Segoe UI", "Microsoft YaHei", sans-serif; }
      .status { fill: #f8fafc; font: 700 14px Inter, "Segoe UI", "Microsoft YaHei", sans-serif; letter-spacing: 0.5px; }
      .center { text-anchor: middle; }
      .line { fill: none; stroke: #72a9c5; stroke-width: 3; marker-end: url(#arrow); }
      .feedback-line { fill: none; stroke: #d5a85b; stroke-width: 3; stroke-dasharray: 10 9; marker-end: url(#arrow-warm); }
    </style>
  </defs>

  <rect width="1440" height="1080" rx="28" fill="url(#background)"/>

  <text x="72" y="64" class="eyebrow">PROJECT JOURNEY · HOW THE QUESTIONS GREW</text>
  <text x="72" y="103" class="title">From product branches to machine limits and three decoupled laboratories</text>

  <path class="line" d="M 330 215 H 382"/>
  <path class="line" d="M 650 215 H 702"/>
  <path class="feedback-line" d="M 970 215 H 1022"/>

  <g filter="url(#shadow)">
    <rect x="70" y="145" width="260" height="140" rx="18" fill="#152239" stroke="#35516e"/>
    <text x="200" y="180" class="eyebrow center">01 · NARRATIVE PRACTICE</text>
    <text x="200" y="216" class="card-title center">Five HTML pages</text>
    <text x="200" y="246" class="card-copy center">Narrative · type · interaction</text>
    <text x="200" y="270" class="small center">InkNarratives</text>

    <rect x="390" y="145" width="260" height="140" rx="18" fill="#152239" stroke="#35516e"/>
    <text x="520" y="180" class="eyebrow center">02 · COMPLETE PRODUCT</text>
    <text x="520" y="216" class="card-title center">DarkRoomLibrary</text>
    <text x="520" y="246" class="card-copy center">Business loop · role boundaries</text>
    <text x="520" y="270" class="small center">Enhanced monolith</text>

    <rect x="710" y="145" width="260" height="140" rx="18" fill="#152239" stroke="#4b6d88"/>
    <text x="840" y="180" class="eyebrow center" style="font-size:13px">03 · REAL TRAINING GROUND</text>
    <text x="840" y="216" class="card-title center">PlainJournal</text>
    <text x="840" y="246" class="card-copy center" style="font-size:15px">Distributed · reliability · acceptance</text>
    <text x="840" y="270" class="small center">Single-machine limit exposed</text>

    <rect x="1030" y="145" width="340" height="140" rx="18" fill="#2b2530" stroke="#a77b45" stroke-dasharray="8 7"/>
    <text x="1200" y="180" class="eyebrow center" fill="#e7bd73">04 · HONEST STOP</text>
    <text x="1200" y="216" class="card-title center">PlainJournalPro</text>
    <text x="1200" y="246" class="card-copy center">Multi-merchant and cross-machine plan</text>
    <text x="1200" y="270" class="small center">No equal evidence, no implementation claim</text>
  </g>

  <path class="line" d="M 520 285 V 327"/>
  <rect x="360" y="296" width="320" height="26" rx="13" fill="#163b4d" stroke="#4f93ad"/>
  <text x="520" y="314" class="status center">IDENTITY ADAPTER · NO SHARED DATABASE</text>

  <g filter="url(#shadow)">
    <rect x="360" y="335" width="320" height="130" rx="20" fill="#152b42" stroke="#4f93ad"/>
    <text x="520" y="365" class="eyebrow center">INDEPENDENT BUSINESS BRANCH</text>
    <text x="520" y="399" class="card-title center">Qixu</text>
    <text x="520" y="430" class="card-copy center">Space · eligibility · allocation · rights</text>
    <text x="520" y="453" class="small center">Owns facts · inherits no upstream role</text>
  </g>

  <path class="line" d="M 840 285 V 486"/>
  <path class="feedback-line" d="M 1200 285 V 486"/>
  <g filter="url(#shadow)">
    <rect x="170" y="495" width="1100" height="105" rx="22" fill="#20233a" stroke="#76648f"/>
    <text x="720" y="526" class="eyebrow center" fill="#c4a7e7">ABSTRACT THE QUESTION INSTEAD OF ADDING MORE FEATURES</text>
    <text x="720" y="558" class="card-title center">Generated code, green tests, and established facts are different states</text>
    <text x="720" y="584" class="card-copy center">Capacity, failure attribution, evidence identity, and authority need separate answers</text>
  </g>

  <text x="72" y="638" class="eyebrow">THREE DECOUPLED LABS · THREE DISTINCT AUTHORITY BOUNDARIES</text>
  <path class="line" d="M 720 600 V 660"/>
  <path class="line" d="M 720 660 H 265 V 680"/>
  <path class="line" d="M 720 660 V 680"/>
  <path class="line" d="M 720 660 H 1175 V 680"/>

  <g filter="url(#shadow)">
    <rect x="70" y="680" width="390" height="170" rx="22" fill="url(#veritrail)" stroke="#62c8bd" stroke-width="2"/>
    <text x="265" y="714" class="eyebrow center">FACT QUALIFICATION</text>
    <text x="265" y="748" class="card-title center">VeriTrail</text>
    <text x="265" y="780" class="card-copy center">What did this run actually prove?</text>
    <text x="265" y="806" class="small center">Evidence · deterministic Verdict</text>
    <rect x="163" y="817" width="204" height="24" rx="12" fill="#1e615f"/>
    <text x="265" y="834" class="status center">INDEPENDENT · LOCAL-FIRST</text>

    <rect x="525" y="680" width="390" height="170" rx="22" fill="#172a42" stroke="#6699c2"/>
    <text x="720" y="714" class="eyebrow center">EXECUTION OWNERSHIP</text>
    <text x="720" y="748" class="card-title center">JPyxis</text>
    <text x="720" y="780" class="card-copy center">Who defines, invokes, runs, and explains failure?</text>
    <text x="720" y="806" class="small center">Contract · lifecycle · runtime boundary</text>
    <rect x="606" y="817" width="228" height="24" rx="12" fill="#254d73"/>
    <text x="720" y="834" class="status center">SINGLE-NODE BASELINE · FROZEN</text>

    <rect x="980" y="680" width="390" height="170" rx="22" fill="#29293f" stroke="#8b82b6" stroke-dasharray="8 7"/>
    <text x="1175" y="714" class="eyebrow center">OS-LEVEL TRUST SUBSTRATE</text>
    <text x="1175" y="748" class="card-title center">FlowKernel</text>
    <text x="1175" y="780" class="card-copy center">What may unreliable policy be allowed to do?</text>
    <text x="1175" y="806" class="small center">Capability · revocation · recovery</text>
    <rect x="1081" y="817" width="188" height="24" rx="12" fill="#4b466d"/>
    <text x="1175" y="834" class="status center">RESEARCH PLAN · PLANNED</text>
  </g>

  <path class="line" d="M 265 850 V 877"/>
  <path class="line" d="M 720 850 V 877"/>
  <path class="line" d="M 1175 850 V 877"/>
  <g filter="url(#shadow)">
    <rect x="210" y="885" width="1020" height="112" rx="24" fill="url(#feedback)" stroke="#567594"/>
    <text x="720" y="914" class="eyebrow center">COMPOSABLE, NOT COLLAPSED · AUTHORITY REMAINS SEPARATE</text>
    <text x="720" y="945" class="card-title center" style="font-size:21px">Three foundations may compose; current boundaries remain single-machine and single-node</text>
    <text x="720" y="972" class="card-copy center">Capacity, deployment, recovery, and real load return PlainJournal's experience to the center</text>
    <text x="720" y="991" class="small center">This is an evidence-feedback loop, not an abandoned-project story</text>
  </g>

  <path class="feedback-line" d="M 1228 940 C 1390 900 1410 230 1360 175 C 1280 92 1090 104 1000 205"/>
  <rect x="1050" y="102" width="320" height="34" rx="17" fill="#3d3328" stroke="#a77b45"/>
  <text x="1210" y="124" class="status center" fill="#e7bd73">BACK TO PLAINJOURNAL'S MACHINE LIMIT</text>

  <rect x="70" y="1018" width="620" height="44" rx="16" fill="#121d31" stroke="#30445f"/>
  <text x="380" y="1046" class="card-copy center">MiniSpringBoot · framework reconstruction challenged by a real full-stack path</text>
  <rect x="750" y="1018" width="620" height="44" rx="16" fill="#121d31" stroke="#30445f"/>
  <text x="1060" y="1046" class="card-copy center">MiniLinux · OS-mechanism learning and low-level experiments</text>
</svg>
